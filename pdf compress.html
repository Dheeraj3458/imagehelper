<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>PDF Compressor</title>
  <style>
    body {font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:0;}
    header {background:#1877f2; color:white; padding:15px; text-align:center;}
    .container {max-width:600px; margin:40px auto; background:white; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
    h1 {text-align:center; color:#333;}
    input[type="file"] {width:100%; padding:8px; margin-top:10px;}
    .btn-group {display:flex; gap:10px; margin-top:20px;}
    button {flex:1; padding:10px; background:#1877f2; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer;}
    button:hover {background:#145db2;}
    #status {margin-top:20px; text-align:center; font-weight:bold;}
    #downloadBtn {display:none; background:#28a745;}
    #downloadBtn:hover {background:#1e7e34;}
  </style>
</head>
<body>
  <header><h2>PDF Compressor Online</h2></header>
  <div class="container">
    <h1>Compress PDF (200–300 KB)</h1>

    <input type="file" id="pdfFile" accept="application/pdf">

    <div class="btn-group">
      <button onclick="compressPDF()">Compress PDF</button>
      <button id="downloadBtn">Download PDF</button>
    </div>

    <p id="status"></p>
  </div>

  <!-- pdf-lib -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <!-- pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <script>
    let finalBlob = null;

    async function compressPDF() {
      const fileInput = document.getElementById('pdfFile');
      const statusEl = document.getElementById('status');
      const downloadBtn = document.getElementById('downloadBtn');

      if (!fileInput.files.length) {
        statusEl.style.color = "red";
        statusEl.innerText = "⚠️ Please choose a PDF file.";
        return;
      }

      const file = fileInput.files[0];
      const { PDFDocument } = PDFLib;
      const newPdf = await PDFDocument.create();

      // Load PDF with pdf.js
      const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;

      let quality = 0.9; // start high
      let step = 0.05;
      let compressedPdfBytes, finalSizeKB;

      do {
        while (newPdf.getPageCount() > 0) newPdf.removePage(0);

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({scale: 1});
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await page.render({canvasContext: ctx, viewport}).promise;

          const imgData = canvas.toDataURL("image/jpeg", quality);
          const imgBytes = await fetch(imgData).then(res => res.arrayBuffer());
          const img = await newPdf.embedJpg(imgBytes);

          const newPage = newPdf.addPage([viewport.width, viewport.height]);
          newPage.drawImage(img, {x:0, y:0, width:viewport.width, height:viewport.height});
        }

        compressedPdfBytes = await newPdf.save();
        finalBlob = new Blob([compressedPdfBytes], { type: "application/pdf" });
        finalSizeKB = finalBlob.size / 1024;

        // अगर size 300 KB से ऊपर है तो quality घटाओ
        if (finalSizeKB > 300) {
          quality -= step;
        }

        // अगर size 200 KB से नीचे चला गया तो loop रोक दो
        if (finalSizeKB < 200) break;

      } while (finalSizeKB > 300 && quality > 0.3);

      if (finalSizeKB >= 200 && finalSizeKB <= 300) {
        statusEl.style.color = "green";
        statusEl.innerText = `✅ Compressed Result: ${Math.round(finalSizeKB)} KB (200–300 KB range)`;
      } else {
        statusEl.style.color = "orange";
        statusEl.innerText = `⚠️ Result: ${Math.round(finalSizeKB)} KB (approximation, may not be exact)`;
      }

      downloadBtn.style.display = "block";
    }

    document.getElementById('downloadBtn').onclick = () => {
      if (finalBlob) {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(finalBlob);
        link.download = "compressed.pdf";
        link.click();
      }
    };
  </script>
</body>
</html>
